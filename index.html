<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RUMMI TECH — VCF Generator</title>
  <style>
    :root{--green:#00ff00;--bg:#000}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg);
      color:var(--green);
      font-family: "Courier New", monospace;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .card{
      width:100%;
      max-width:680px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(0,255,0,0.15);
      border-radius:10px;
      padding:18px;
      box-shadow:0 0 20px rgba(0,255,0,0.04);
    }
    h1{margin:0 0 14px 0;text-align:center}
    form{display:flex;flex-direction:column;gap:10px}
    input[type="text"], input[type="tel"], input[type="number"], input[type="email"], input[type="password"]{
      padding:10px;border-radius:6px;border:1px solid rgba(0,255,0,0.12);
      background:#000;color:var(--green);font-size:15px;font-family:inherit;
    }
    button{
      padding:10px;border-radius:8px;border:1px solid rgba(0,255,0,0.12);
      background:#000;color:var(--green);cursor:pointer;font-size:15px;
    }
    button.primary{background:var(--green);color:#000;font-weight:700}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .tracker{margin-top:14px;text-align:center}
    .small{font-size:13px;opacity:0.9}
    #progressBar{height:14px;border-radius:999px;background:transparent;border:1px solid rgba(0,255,0,0.08);overflow:hidden;margin-top:8px}
    #progressFill{height:100%;width:0%;background:linear-gradient(90deg,#00ff00,#88ff88)}
    .flex-between{display:flex;justify-content:space-between;align-items:center}
    .muted{color:rgba(0,255,0,0.6);font-size:13px}
    .whatsapp-links{margin-top:12px;text-align:center;display:none;}
    .whatsapp-links a{display:block;margin:4px 0;color:var(--green);text-decoration:none;font-weight:700;}
    
    /* --- NEW ADMIN TABLE STYLES --- */
    .table-container { max-height: 250px; overflow-y: auto; margin-top: 15px; border: 1px solid rgba(0,255,0,0.2); border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid rgba(0,255,0,0.15); padding: 8px; text-align: left; }
    th { background: rgba(0,255,0,0.1); position: sticky; top: 0; }
    
    footer{margin-top:12px;text-align:center;font-size:12px;color:rgba(0,255,0,0.6)}
    @media(max-width:560px){.card{padding:12px}}
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>RUMMI TECH — VCF Generator</h1>

    <form id="vcfForm" autocomplete="off" novalidate>
      <input id="name" type="text" placeholder="Full name" required />
      <input id="phone" type="tel" placeholder="+254712345678" required />
      <div class="row">
        <button id="submitBtn" type="submit">Register</button>
        <button id="downloadBtn" type="button" style="display:none" class="primary">Download VCF (All)</button>
      </div>
      <div id="downloadMessage" class="small muted"></div>
    </form>

    <div class="tracker">
      <div class="flex-between">
        <div>Target: <strong id="targetCount">0</strong></div>
        <div>Registered: <strong id="registeredCount">0</strong></div>
      </div>
      <div class="flex-between" style="margin-top:6px">
        <div>Remaining: <strong id="remainingCount">0</strong></div>
        <div>Progress: <strong id="progressPercent">0%</strong></div>
      </div>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>

    <div id="adminLoginSection" style="margin-top:12px; text-align:center;">
      <input id="adminEmail" type="email" placeholder="Admin email" style="width:45%;padding:10px;margin:5px;">
      <input id="adminPassword" type="password" placeholder="Password" style="width:45%;padding:10px;margin:5px;">
      <button id="adminLoginBtn" style="padding:10px 15px;margin-left:5px;">Login</button>
      <p id="adminLoginStatus" class="muted small"></p>
    </div>

    <div id="adminPanel" style="display:none; margin-top:12px;">
      <div style="display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;">
        <input id="targetInput" type="number" placeholder="Set new target" min="1" style="max-width: 120px;" />
        <button id="setTargetBtn">Set Target</button>
        <button id="exportCsvBtn" style="background:#003300;color:var(--green)">Export CSV</button>
        <button id="resetBtn" style="background:#440000;color:var(--green)">Reset Data</button>
        <button id="logoutBtn" style="background:transparent;color:var(--green);border:none;text-decoration:underline;">Logout</button>
      </div>
      <div style="margin-top:8px; text-align:center;" class="muted small" id="adminMsg"></div>

      <div class="table-container">
        <table id="dataTable">
          <thead>
            <tr><th>Name</th><th>Phone</th><th>Time</th></tr>
          </thead>
          <tbody id="dataTableBody">
            </tbody>
        </table>
      </div>
    </div>

    <div class="whatsapp-links" id="whatsappLinks">
      <p class="small">Thank you for registering! Join our WhatsApp Group & Channel:</p>
      <a href="https://chat.whatsapp.com/JUkz9U1unTrGt5WgJlPMjT" target="_blank">Join WhatsApp Group</a>
      <a href="https://whatsapp.com/channel/0029VbB6mU14dTnPVhEaBS1C" target="_blank">Join WhatsApp Channel</a>
    </div>

    <footer>© RUMMI TECH</footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, get, child, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDnVw3m6tVSZFllGvI8M0KnvOelyfCNmyU",
      authDomain: "rummitechvcf.firebaseapp.com",
      projectId: "rummitechvcf",
      storageBucket: "rummitechvcf.firebasestorage.app",
      messagingSenderId: "478685720198",
      appId: "1:478685720198:web:8f3447fe8fdf535e7c6b07",
      measurementId: "G-ZQP9152Z5R"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // --- CONFIG ---
    // Change this to whatever emoji you want attached to the saved names!
    const vcfEmoji = " 💦🍆"; 
    // --------------

    const form = document.getElementById("vcfForm");
    const nameInput = document.getElementById("name");
    const phoneInput = document.getElementById("phone");
    const submitBtn = document.getElementById("submitBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const downloadMessage = document.getElementById("downloadMessage");

    const registeredEl = document.getElementById("registeredCount");
    const remainingEl = document.getElementById("remainingCount");
    const progressEl = document.getElementById("progressPercent");
    const targetEl = document.getElementById("targetCount");
    const progressFill = document.getElementById("progressFill");

    const adminLoginSection = document.getElementById("adminLoginSection");
    const adminLoginBtn = document.getElementById("adminLoginBtn");
    const adminLoginStatus = document.getElementById("adminLoginStatus");
    const adminPanel = document.getElementById("adminPanel");
    const adminEmail = document.getElementById("adminEmail");
    const adminPassword = document.getElementById("adminPassword");
    const logoutBtn = document.getElementById("logoutBtn");
    const resetBtn = document.getElementById("resetBtn");
    const setTargetBtn = document.getElementById("setTargetBtn");
    const exportCsvBtn = document.getElementById("exportCsvBtn");
    const targetInput = document.getElementById("targetInput");
    const adminMsg = document.getElementById("adminMsg");
    const dataTableBody = document.getElementById("dataTableBody");

    const whatsappLinks = document.getElementById("whatsappLinks");

    const registrationsRef = ref(db, "registrations");
    const targetRef = ref(db, "target");

    let targetCount = 100;

    // Helper to escape VCF syntax
    function escapeV(v){
      return String(v).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
    }

    // Helper to escape HTML for the data table
    function escapeHTML(str) {
      return String(str || "").replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }

    // Load target
    onValue(targetRef, (snap) => {
      if (snap.exists()) targetCount = Number(snap.val());
      targetEl.textContent = targetCount;
      updateCountsOnce();
    });

    async function updateCountsOnce(){
      try{
        const snap = await get(registrationsRef);
        const count = snap.exists() ? Object.keys(snap.val()).length : 0;
        registeredEl.textContent = count;
        remainingEl.textContent = Math.max(targetCount - count, 0);
        const pct = targetCount > 0 ? Math.min(Math.round((count / targetCount) * 100),100):0;
        progressEl.textContent = pct+"%";
        progressFill.style.width = pct+"%";
      }catch(e){}
    }

    // Registration form submit
    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const name = (nameInput.value||"").trim();
      let phone = (phoneInput.value||"").trim().replace(/\s+/g,"");

      if(!name){ alert("Enter full name"); return; }
      if(!phone || !phone.startsWith("+") || phone.length<8){ alert("Phone with country code required, e.g. +254712345678"); return; }

      try{
        const snap = await get(registrationsRef);
        if(snap.exists()){
          const data = snap.val();
          const exists = Object.values(data).some(r=>r.tel===phone);
          if(exists){ alert("This number is already registered."); return; }
        }
        await push(registrationsRef, { fn:name, tel:phone, timestamp:new Date().toISOString() });
        nameInput.value=""; phoneInput.value="";
        downloadMessage.textContent="Registration successful — thank you.";

        whatsappLinks.style.display = "block";

        setTimeout(()=>{ if(downloadMessage.textContent==="Registration successful — thank you.") downloadMessage.textContent=""; },3000);
      }catch(err){
        alert("Failed to register: "+err.message);
      }
    });

    // Admin login
    adminLoginBtn.addEventListener("click", async ()=>{
      const email = adminEmail.value.trim();
      const pw = adminPassword.value.trim();
      if(!email || !pw){ adminLoginStatus.textContent="Enter email and password"; return; }
      try{
        await signInWithEmailAndPassword(auth,email,pw);
        adminLoginStatus.textContent="Logging in...";
      }catch(err){
        adminLoginStatus.textContent="Login failed: "+err.message;
      }
    });

    logoutBtn.addEventListener("click", async ()=>{ await signOut(auth); });

    onAuthStateChanged(auth, async (user)=>{
      if(user){
        const uSnap = await get(child(ref(db),`users/${user.uid}`));
        if(uSnap.exists() && uSnap.val().role==="admin"){
          adminPanel.style.display="block";
          adminLoginSection.style.display="none";
          adminMsg.textContent=`Admin: ${user.email}`;
        }else{
          adminPanel.style.display="none";
          adminLoginSection.style.display="block";
          adminLoginStatus.textContent="Not an admin";
        }
      }else{
        adminPanel.style.display="none";
        adminLoginSection.style.display="block";
        adminLoginStatus.textContent="";
      }
    });

    // Set target
    setTargetBtn.addEventListener("click", async ()=>{
      const v = Number(targetInput.value);
      if(!v || v<=0){ alert("Enter valid number"); return; }
      try{
        await set(targetRef,v);
        adminMsg.textContent=`Target set to ${v}`;
      }catch(err){ alert("Failed: "+err.message); }
    });

    // Reset registrations
    resetBtn.addEventListener("click", async ()=>{
      if(!confirm("Are you sure you want to completely clear all registrations? This cannot be undone.")) return;
      try{ 
        await remove(registrationsRef); 
        adminMsg.textContent="Registrations cleared"; 
        whatsappLinks.style.display="none"; 
      }catch(err){ alert("Failed: "+err.message); }
    });

    // --- NEW: Export CSV ---
    exportCsvBtn.addEventListener("click", async ()=>{
      try {
        const snap = await get(registrationsRef);
        if(!snap.exists()){ alert("No registrations to export."); return; }
        const data = snap.val();
        
        let csvContent = "data:text/csv;charset=utf-8,Name,Phone,Timestamp\n";
        
        for(const id of Object.keys(data)){
          const r = data[id];
          // Escape quotes for CSV
          const nameStr = `"${(r.fn||"").replace(/"/g, '""')}"`;
          const phoneStr = `"${(r.tel||"")}"`;
          const timeStr = `"${(r.timestamp||"")}"`;
          csvContent += `${nameStr},${phoneStr},${timeStr}\n`;
        }
        
        const encodedUri = encodeURI(csvContent);
        const a = document.createElement("a");
        a.href = encodedUri;
        const now = new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
        a.download = `registrations_${now}.csv`;
        document.body.appendChild(a); 
        a.click(); 
        document.body.removeChild(a);
      } catch(err) { 
        alert("Failed to export CSV: " + err.message); 
      }
    });

    // Download VCF
    // Download VCF (Hardcoded Name with Date Only)
    downloadBtn.addEventListener("click", async ()=>{
      try{
        const snap = await get(registrationsRef);
        if(!snap.exists()){ alert("No registrations"); return; }
        
        // Format the date (YYYY-MM-DD)
        const dateOnly = new Date().toISOString().split('T')[0];
        const finalName = `rummitech vcf ${dateOnly}.vcf`;

        const data = snap.val();
        const lines=[];
        for(const id of Object.keys(data)){
          const r = data[id];
          lines.push("BEGIN:VCARD");
          lines.push("VERSION:3.0");
          // This line appends the emoji to the name
          lines.push(`FN:${escapeV(r.fn||"No Name")}${vcfEmoji}`);
          if(r.tel) lines.push(`TEL:${escapeV(r.tel)}`);
          lines.push("END:VCARD");
        }
        const vcf=lines.join("\r\n")+"\r\n";
        const blob=new Blob([vcf],{type:"text/vcard;charset=utf-8"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download=finalName; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      }catch(err){ alert("Failed to build VCF: "+err.message); }
    });
    // Real-time update (handles progress bar and admin table)
    onValue(registrationsRef, (snap)=>{
      let count = 0;
      dataTableBody.innerHTML = ""; // Clear table for new data
      
      if (snap.exists()) {
        const data = snap.val();
        const records = Object.values(data);
        count = records.length;
        
        // Populate the Admin Table (latest on top)
        records.reverse().forEach(r => {
          const d = new Date(r.timestamp);
          const timeString = isNaN(d) ? "Unknown" : d.toLocaleString();
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${escapeHTML(r.fn)}</td><td>${escapeHTML(r.tel)}</td><td>${timeString}</td>`;
          dataTableBody.appendChild(tr);
        });
      } else {
        dataTableBody.innerHTML = "<tr><td colspan='3' style='text-align:center; padding:15px;'>No registrations yet</td></tr>";
      }

      registeredEl.textContent=count;
      remainingEl.textContent=Math.max(targetCount-count,0);
      const pct=targetCount>0?Math.min(Math.round((count/targetCount)*100),100):0;
      progressEl.textContent=pct+"%";
      progressFill.style.width=pct+"%";

      if(count>=targetCount && targetCount>0){
        downloadBtn.style.display="inline-block";
        downloadMessage.textContent="";
      }else{
        downloadBtn.style.display="none";
        downloadMessage.textContent=`VCF will be available after ${targetCount} registrations are reached`;
      }
    });

  </script>
</body>
</html>
