<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rummitech VCF Generator</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background-color: #000;
    color: #00FF00;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0,255,0,0.05) 0px,
      rgba(0,255,0,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
  }

  h1 {
    text-align:center;
    font-size:2rem;
    margin-bottom:20px;
    text-shadow:0 0 5px #0F0,0 0 10px #0F0;
  }

  form {
    display:flex;
    flex-direction:column;
    gap:15px;
    width:100%;
    max-width:400px;
    background-color:rgba(0,0,0,0.6);
    padding:20px;
    border:1px solid #0F0;
    border-radius:10px;
    box-shadow:0 0 10px #0F0;
  }

  input, button {
    padding:10px;
    border:1px solid #0F0;
    border-radius:5px;
    background-color:#000;
    color:#0F0;
    font-family:monospace;
    font-size:1rem;
  }

  input:focus {
    outline:none;
    box-shadow:0 0 5px #0F0;
  }

  button {
    cursor:pointer;
    background-color:#000;
    transition:all 0.2s;
  }

  button:hover {
    background-color:#0F0;
    color:#000;
    font-weight:bold;
  }

  #tracker {
    margin-top:20px;
    text-align:center;
  }

  #progressBar {
    width:100%;
    max-width:400px;
    height:20px;
    border:1px solid #0F0;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
  }

  #progressFill {
    height:100%;
    background-color:#0F0;
    width:0%;
    transition:width 0.5s;
  }

  footer {
    text-align:center;
    font-size:0.9rem;
    color:#0F0;
    margin-top:20px;
  }

  @media(max-width:500px){
    h1{font-size:1.5rem;}
    form{padding:15px; gap:10px;}
  }
</style>
</head>
<body>

<h1>Rummitech VCF Generator</h1>

<form id="vcfForm">
  <input type="text" name="fn" placeholder="Full Name" required>
  <input type="text" name="tel" placeholder="Phone">
  <button type="submit">Download VCF</button>
</form>

<div id="tracker">
  <div>Target Required: <span id="target">100</span></div>
  <div>Registered: <span id="registered">0</span></div>
  <div>Remaining: <span id="remaining">100</span></div>
  <div>Progress: <span id="percentage">0%</span></div>
  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<footer>Generated by Rummitech</footer>

<!-- Firebase SDK -->
<script type="module">
  // Import Firebase modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyDnVw3m6tVSZFllGvI8M0KnvOelyfCNmyU",
    authDomain: "rummitechvcf.firebaseapp.com",
    databaseURL: "https://rummitechvcf-default-rtdb.firebaseio.com",
    projectId: "rummitechvcf",
    storageBucket: "rummitechvcf.appspot.com",
    messagingSenderId: "478685720198",
    appId: "1:478685720198:web:8f3447fe8fdf535e7c6b07",
    measurementId: "G-ZQP9152Z5R"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const TARGET = 100;

  async function getTotalRegistrations() {
    const snapshot = await get(ref(db, 'registrations'));
    return snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
  }

  async function addRegistration(data) {
    await push(ref(db, 'registrations'), data);
  }

  async function updateTracker() {
    const total = await getTotalRegistrations();
    document.getElementById('target').textContent = TARGET;
    document.getElementById('registered').textContent = total;
    document.getElementById('remaining').textContent = Math.max(TARGET - total, 0);
    document.getElementById('percentage').textContent = Math.min(Math.round((total/TARGET)*100),100) + "%";
    document.getElementById('progressFill').style.width = Math.min(Math.round((total/TARGET)*100),100) + "%";
  }

  // Initial tracker update
  updateTracker();
  setInterval(updateTracker, 5000);

  document.getElementById('vcfForm').addEventListener('submit', async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    const total = await getTotalRegistrations();

    if(total >= TARGET){
      // Generate and download VCF
      const vcf = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${data.fn}`,
        data.tel ? `TEL;TYPE=CELL:${data.tel}` : "",
        "END:VCARD"
      ].filter(Boolean).join("\r\n") + "\r\n";

      const blob = new Blob([vcf], {type:"text/vcard"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (data.fn || 'contact') + '.vcf';
      a.click();
      URL.revokeObjectURL(url);

    } else {
      // Register user
      await addRegistration({...data, timestamp: new Date().toISOString()});
      alert("Registration recorded! Download will be available once target is reached.");
    }

    updateTracker();
  });
</script>

</body>
</html>
