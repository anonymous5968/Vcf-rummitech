<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rummitech VCF Generator</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background-color: #000000;
    color: #00FF00;
    display: flex;
    flex-direction: column;
    justify-content: center; /* vertically center */
    align-items: center;     /* horizontally center */
    min-height: 100vh;
    padding: 20px;
    background-image: repeating-linear-gradient(
      0deg,
      rgba(0,255,0,0.05) 0px,
      rgba(0,255,0,0.05) 2px,
      transparent 2px,
      transparent 4px
    );
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 20px;
    text-shadow: 0 0 5px #00FF00, 0 0 10px #00FF00;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 400px;
    background-color: rgba(0,0,0,0.6);
    padding: 20px;
    border: 1px solid #00FF00;
    border-radius: 10px;
    box-shadow: 0 0 10px #00FF00;
  }

  input, button {
    padding: 10px;
    border: 1px solid #00FF00;
    border-radius: 5px;
    background-color: #000000;
    color: #00FF00;
    font-family: monospace;
    font-size: 1rem;
  }

  input:focus {
    outline: none;
    box-shadow: 0 0 5px #00FF00;
  }

  button {
    cursor: pointer;
    background-color: #000000;
    transition: all 0.2s;
  }

  button:hover {
    background-color: #00FF00;
    color: #000000;
    font-weight: bold;
  }

  footer {
    text-align: center;
    font-size: 0.9rem;
    color: #00FF00;
    margin-top: 20px;
  }

  @media(max-width: 500px) {
    h1 { font-size: 1.5rem; }
    form { padding: 15px; gap: 10px; }
  }
</style>
</head>
<body>

<h1>Rummitech VCF Generator</h1>

<form id="vcfForm">
  <input type="text" name="fn" placeholder="Full Name" required>
  <input type="text" name="tel" placeholder="Phone">
  <button type="submit">Download VCF</button>
</form>

<footer>Generated by Rummitech</footer>

<script>
document.getElementById('vcfForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const escapeVal = s => (s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  const vcf = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `FN:${escapeVal(data.fn)}`,
    data.tel ? `TEL;TYPE=CELL:${escapeVal(data.tel)}` : "",
    "END:VCARD"
  ].filter(Boolean).join("\r\n") + "\r\n";

  const blob = new Blob([vcf], {type:"text/vcard"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (data.fn || 'contact') + '.vcf';
  a.click();
  URL.revokeObjectURL(url);
});
</script>

</body>
</html>
