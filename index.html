<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rummitech VCF Generator</title>
<style>
  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background-color: #000;
    color: #00FF00;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 20px;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 400px;
    background-color: rgba(0,0,0,0.6);
    padding: 20px;
    border: 1px solid #0F0;
    border-radius: 10px;
  }

  input, button {
    padding: 10px;
    border: 1px solid #0F0;
    border-radius: 5px;
    background-color: #000;
    color: #0F0;
    font-family: monospace;
    font-size: 1rem;
  }

  button {
    cursor: pointer;
    transition: all 0.2s;
  }

  button:hover {
    background-color: #0F0;
    color: #000;
    font-weight: bold;
  }

  #tracker {
    margin-top: 20px;
    text-align: center;
  }

  #progressBar {
    width: 100%;
    max-width: 400px;
    height: 20px;
    border: 1px solid #0F0;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 10px;
  }

  #progressFill {
    height: 100%;
    background-color: #0F0;
    width: 0%;
    transition: width 0.5s;
  }
</style>
</head>
<body>

<h1>Rummitech VCF Generator</h1>

<form id="vcfForm">
  <input type="text" name="fn" placeholder="Full Name" required>
  <input type="text" name="tel" placeholder="Phone Number">
  <button type="submit">Submit / Download</button>
</form>

<div id="tracker">
  <div>Target Required: <span id="target">100</span></div>
  <div>Registered: <span id="registered">0</span></div>
  <div>Remaining: <span id="remaining">100</span></div>
  <div>Progress: <span id="percentage">0%</span></div>
  <div id="progressBar"><div id="progressFill"></div></div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getDatabase, ref, push, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

// ------------------ YOUR FIREBASE CONFIG ------------------
const firebaseConfig = {
  apiKey: "AIzaSyDnVw3m6tVSZFllGvI8M0KnvOelyfCNmyU",
  authDomain: "rummitechvcf.firebaseapp.com",
  databaseURL: "https://rummitechvcf-default-rtdb.firebaseio.com",
  projectId: "rummitechvcf",
  storageBucket: "rummitechvcf.appspot.com",
  messagingSenderId: "478685720198",
  appId: "1:478685720198:web:8f3447fe8fdf535e7c6b07",
  measurementId: "G-ZQP9152Z5R"
};
// ----------------------------------------------------------

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const TARGET = 100;

// Get total registrations
async function getTotalRegistrations() {
  const snapshot = await get(ref(db, 'registrations'));
  return snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
}

// Add new registration
async function addRegistration(data) {
  await push(ref(db, 'registrations'), data);
}

// Update tracker UI
async function updateTracker() {
  const total = await getTotalRegistrations();
  document.getElementById('target').textContent = TARGET;
  document.getElementById('registered').textContent = total;
  document.getElementById('remaining').textContent = Math.max(TARGET - total, 0);
  const percentage = Math.min(Math.round((total / TARGET) * 100), 100);
  document.getElementById('percentage').textContent = percentage + "%";
  document.getElementById('progressFill').style.width = percentage + "%";
}

// Initial tracker update and auto-refresh
updateTracker();
setInterval(updateTracker, 5000);

// Form submit
document.getElementById('vcfForm').addEventListener('submit', async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(e.target).entries());
  const total = await getTotalRegistrations();

  if(total >= TARGET){
    // Target reached → generate VCF
    const vcf = `
BEGIN:VCARD
VERSION:3.0
FN:${data.fn}
${data.tel ? `TEL;TYPE=CELL:${data.tel}` : ""}
END:VCARD`.trim();

    const blob = new Blob([vcf], {type:"text/vcard"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (data.fn || 'contact') + '.vcf';
    a.click();
    URL.revokeObjectURL(url);
    alert("VCF Downloaded!");

  } else {
    // Register user
    await addRegistration({...data, timestamp: new Date().toISOString()});
    alert("Registration recorded! Download available once target is reached.");
  }

  updateTracker();
});
</script>
</body>
</html>
