<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RUMMI TECH Registration</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    #adminPanel { display: none; border: 2px solid black; padding: 10px; margin-top: 20px; }
    #downloadBtn { display: none; margin-top: 10px; }
  </style>
</head>
<body>

<h2>🔥 RUMMI TECH Invite Registration</h2>

<div id="registerSection">
  <input id="name" placeholder="Your Name" /> <br><br>
  <input id="phone" placeholder="+254712345678" /> <br><br>
  <button id="submitBtn">Submit</button>
</div>

<hr>

<h3>Progress</h3>
<p>Registered: <span id="registered">0</span> / <span id="target">100</span></p>
<p>Remaining: <span id="remaining">100</span></p>
<p>Progress: <span id="progress">0%</span></p>

<p id="downloadMessage">VCF will be available after the target is reached.</p>
<button id="downloadBtn">Download VCF</button>

<hr>

<h3>Admin Login</h3>
<input id="email" placeholder="Admin Email" /><br><br>
<input id="password" type="password" placeholder="Admin Password" /><br><br>
<button id="loginBtn">Login</button>

<div id="adminPanel">
  <h3>ADMIN PANEL</h3>

  <label>Change Target:</label><br>
  <input id="targetInput" type="number" /><br><br>
  <button id="setTargetBtn">Update Target</button><br><br>

  <button id="resetBtn" style="background:red;color:white;">RESET REGISTRATIONS</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { 
    getDatabase, ref, set, push, onValue, remove 
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  
  // --------- YOUR FIREBASE CONFIG ----------
  const firebaseConfig = {
    apiKey: "AIzaSyDnVw3m6tVSZFllGvI8M0KnvOelyfCNmyU",
    authDomain: "rummitechvcf.firebaseapp.com",
    projectId: "rummitechvcf",
    storageBucket: "rummitechvcf.firebasestorage.app",
    messagingSenderId: "478685720198",
    appId: "1:478685720198:web:8f3447fe8fdf535e7c6b07",
    measurementId: "G-ZQP9152Z5R"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth();
  const db = getDatabase();

  const submitBtn = document.getElementById("submitBtn");
  const registeredEl = document.getElementById("registered");
  const targetEl = document.getElementById("target");
  const remainingEl = document.getElementById("remaining");
  const progressEl = document.getElementById("progress");
  const downloadBtn = document.getElementById("downloadBtn");
  const downloadMessage = document.getElementById("downloadMessage");
  const adminPanel = document.getElementById("adminPanel");

  // ---------- SAVE REGISTRATION ----------
  submitBtn.addEventListener("click", async () => {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();

    if (!name || !phone.startsWith("+") || phone.length < 10) {
      alert("Enter valid name and phone (+ country code format)");
      return;
    }

    const regRef = ref(db, "registrations");
    await push(regRef, {
      name, phone,
      timestamp: new Date().toISOString()
    });

    alert("Registered successfully!");
  });


  // --------- REAL-TIME COUNT UPDATE ---------
  const registrationsRef = ref(db, "registrations");
  let targetCount = 100;

  onValue(ref(db, "target"), (snapshot) => {
    if(snapshot.exists()){
      targetCount = snapshot.val();
      targetEl.textContent = targetCount;
    }
  });

  onValue(registrationsRef, (snapshot) => {
    const count = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
    registeredEl.textContent = count;
    remainingEl.textContent = Math.max(targetCount - count, 0);
    progressEl.textContent = Math.min(((count / targetCount) * 100).toFixed(0), 100) + "%";

    if (count >= targetCount) {
      downloadBtn.style.display = "inline-block";
      downloadMessage.textContent = "";
    } else {
      downloadBtn.style.display = "none";
      downloadMessage.textContent = `VCF available after ${targetCount} registrations`;
    }
  });


  // --------- ADMIN LOGIN ----------
  loginBtn.onclick = () => {
    signInWithEmailAndPassword(auth, email.value, password.value)
    .then(() => {
      adminPanel.style.display = "block";
      alert("Admin logged in");
    })
    .catch(err => alert(err.message));
  };

  // -------- UPDATE TARGET ----------
  document.getElementById("setTargetBtn").onclick = async () => {
    const value = Number(document.getElementById("targetInput").value);
    if(value > 0){
      await set(ref(db, "target"), value);
      alert("Target updated");
    } else {
      alert("Enter valid number");
    }
  };

  // -------- RESET DATABASE ----------
  document.getElementById("resetBtn").onclick = async () => {
    if(confirm("Are you sure? This will delete all records!")){
      await remove(ref(db, "registrations"));
      alert("All registrations cleared!");
    }
  };
</script>

</body>
</html>
